[package]
name = "whistleflow"
version = "0.1.0"
description = "Offline Wispr-Flow-style voice dictation powered by Cactus Whistle (16.9 MB)"
authors = ["WhistleFlow"]
edition = "2021"

[lib]
name = "whistleflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
arboard = "3.4"
enigo = "0.2"
reqwest = { version = "0.12", features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
